# Drop-in: renew BEFORE expiry, not after it.
#
# The medic's default RENEW_AHEAD_SECS is 600 (10 minutes), which makes it a
# repair tool: it acts once a token is already expired or about to be. Paired
# with the daily timer that leaves a window in which a token is dead and only a
# gateway restart reveals it.
#
# 259200s = 3 days. With a daily run, every token is renewed roughly three days
# before it lapses, so a token is never expired in normal operation and a
# gateway restart at any moment finds all of them valid.
[Service]
Environment=RENEW_AHEAD_SECS=259200
