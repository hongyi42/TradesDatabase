# Drop-in: let the timer trigger this unit more than once.
#
# THE BUG THIS FIXES (found 2026-09-06). The unit was written as a BOOT oneshot
# (WantedBy=multi-user.target) with RemainAfterExit=yes, which is correct for
# boot: the unit stays `active` so `systemctl is-active` reports that it ran.
#
# sandbox-token-medic.timer was then added on top of it without changing that
# flag. systemd will NOT trigger a unit that is already active, so the timer
# fired exactly once — 2026-09-06 03:24:56 UTC — and its NextElapse went empty
# and stayed empty. The daily renewal that the whole 2026-09-05 expired-token
# fix depends on had become a one-shot, silently.
#
# RemainAfterExit=no lets the unit return to `inactive` after each successful
# run, so the timer can trigger it again tomorrow.
#
# SAFE FOR MONITORING: box-report.sh judges a Type=oneshot unit on Result, not
# ActiveState (unit_status, box-report.sh:210-217), so a unit that has run and
# gone inactive still reports `ok success` rather than a false DOWN.
#
# Boot ordering is unaffected: Before=nemoclaw-boot.service orders unit START,
# and does not depend on the unit staying active afterwards.
[Service]
RemainAfterExit=no
# The medic prints one line per sandbox plus a summary. Those went nowhere —
# `journalctl -u sandbox-token-medic` showed "No entries" across 48 hours, so
# there was no way to audit what the 03:24:56 run actually did.
StandardOutput=journal
StandardError=journal
