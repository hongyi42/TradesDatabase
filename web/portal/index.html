<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Deliberate, and NOT for the reason you would guess: this shell is
         served unauthenticated and the landing is our public marketing page.
         We stay unindexed because the only URL it has is an onrender.com
         sub-path. Reasons and the trigger to drop it:
         docs/design/decisions/2026-08-22-landing-stays-noindexed.md -->
    <meta name="robots" content="noindex, nofollow" />
    <title>TradesDatabase — one record for every job, built from what your crew already texts</title>
    <meta
      name="description"
      content="Your crew texts what happened; it becomes a searchable customer and job record where every field cites the message it came from. No app to install, nothing to log into."
    />
    <!-- Social cards. No og:image yet — there is no artwork to point at, and a
         broken image URL renders worse than none. Add one with the photography. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TradesDatabase" />
    <meta
      property="og:description"
      content="One record for every job, built from what your crew already texts."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
